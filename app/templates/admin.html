<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN Observer</title>

<style>
:root {
  --bg: #0b0f14;
  --card: #121822;
  --text: #e6edf3;
  --muted: #8b949e;
  --green: #3fb950;
  --red: #f85149;
  --blue: #58a6ff;
  --border: #21262d;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

main { padding: 20px; }

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
}

.card h2 {
  margin: 0 0 6px;
  font-size: 14px;
  color: var(--muted);
}

.card div {
  font-size: 22px;
  font-weight: 600;
}

.table {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead { background: #0e1621; }

th, td {
  padding: 12px 14px;
  text-align: left;
  font-size: 14px;
}

th {
  color: var(--muted);
  font-weight: 500;
}

tr:not(:last-child) td {
  border-bottom: 1px solid var(--border);
}

.status { font-weight: 600; }
.status.online { color: var(--green); }
.status.offline { color: var(--red); }

.traffic {
  color: var(--blue);
  font-weight: 500;
}

.fade { animation: fade 0.4s ease-in-out; }

@keyframes fade {
  from { opacity: 0.4 }
  to { opacity: 1 }
}

canvas {
  width: 100%;
  background: #0f141c;
  border-top: 1px solid var(--border);
}

@media (max-width: 600px) {
  th:nth-child(3),
  td:nth-child(3) {
    display: none;
  }
}
</style>
</head>

<body>

<header>
<h1>VPN Observer</h1>
<span id="updated">обновление…</span>
</header>

<main>

<div class="cards">
  <div class="card">
    <h2>Онлайн</h2>
    <div id="count-online">–</div>
  </div>
  <div class="card">
    <h2>Всего Принято</h2>
    <div id="total-rx">–</div>
  </div>
  <div class="card">
    <h2>Всего Отправлено</h2>
    <div id="total-tx">–</div>
  </div>
</div>

<div class="table">
<table>
<thead>
<tr>
<th>Session</th>
<th>Status</th>
<th>Uptime</th>
<th>Remote IP</th>
<th>VPN IP</th>
<th>RX</th>
<th>TX</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<canvas id="graph" height="120" style="display: none;"></canvas>
</div>

</main>

<script>

function speed(v){
  if(!v) return "0 KB/s";

  if(v > 1024*1024)
    return (v/1024/1024).toFixed(2) + " MB/s";

  return (v/1024).toFixed(1) + " KB/s";
}

function mb(v){
  return ((v || 0) / 1024 / 1024).toFixed(1) + " MB";
}

async function load(){

  const res = await fetch("/api/realtime");
  const data = await res.json();

  const sessions = data.sessions || [];
  const usersMeta = data.users || {};

  const tbody = document.getElementById("rows");

  const users = {};

  sessions.forEach(s=>{
    if(!users[s.username]) users[s.username] = [];
    users[s.username].push(s);
  });

  const sortedUsers = Object.keys(users).sort();

  let html = "";
  let onlineUsers = 0;
  let totalRx = 0;
  let totalTx = 0;

  sortedUsers.forEach(user=>{

    const sess = users[user];
    onlineUsers++;

    let userRx = 0;
    let userTx = 0;

    sess.forEach(s=>{
      userRx += s.rx || 0;
      userTx += s.tx || 0;
    });

    totalRx += userRx;
    totalTx += userTx;

    html += `
    <tr style="background:#0f141c">
        <td colspan="7">
        <b>${user}</b>
        <span style="color:#8b949e">
            (${sess.length} sessions)
            • ↓ ${speed(usersMeta[user]?.speed_rx || 0)}
            • ↑ ${speed(usersMeta[user]?.speed_tx || 0)}
        </span>
        </td>
    </tr>
    `;

    sess.forEach(s=>{
      html += `
        <tr class="fade">
          <td>↳ ${s.session_id}</td>
          <td class="status online">ONLINE</td>
          <td>${s.uptime}</td>
          <td>${s.remote_ip}</td>
          <td>${s.vpn_ip || "-"}</td>
          <td class="traffic">${mb(s.rx)}</td>
          <td class="traffic">${mb(s.tx)}</td>
        </tr>
      `;
    });

  });

  // --- OFFLINE USERS ---
  Object.entries(usersMeta).forEach(([user,u])=>{
    if(!u.online){
      html += `
        <tr>
          <td>${user}</td>
          <td class="status offline">OFFLINE</td>
          <td>-</td>
          <td>-</td>
          <td>-</td>
          <td>-</td>
          <td>-</td>
        </tr>
      `;
    }
  });

  tbody.innerHTML = html;

  document.getElementById("count-online").innerText = onlineUsers;
  document.getElementById("total-rx").innerText = mb(totalRx);
  document.getElementById("total-tx").innerText = mb(totalTx);
  document.getElementById("updated").innerText =
    "обновлено " + new Date().toLocaleTimeString();
}

load();
setInterval(load,5000);

// --- GRAPH ---

const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");

async function drawGraph(){

  const res = await fetch("/api/history");
  const history = await res.json();

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const users = Object.keys(history);
  if(!users.length) return;

  let maxVal = 1;

  users.forEach(u=>{
    history[u].forEach(p=>{
      maxVal = Math.max(maxVal, p.rx + p.tx);
    });
  });

  let colorIndex = 0;

  users.forEach(user=>{
    const data = history[user];

    ctx.beginPath();
    ctx.strokeStyle = `hsl(${colorIndex*60},70%,60%)`;
    colorIndex++;

    data.forEach((p,i)=>{
      const x = (i / 60) * canvas.width;
      const y = canvas.height - ((p.rx + p.tx) / maxVal) * canvas.height;

      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    });

    ctx.stroke();
  });
}

drawGraph();
setInterval(drawGraph,5000);

</script>

</body>
</html>
