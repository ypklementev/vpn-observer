{% extends "base.html" %}
{% block content %}
<h2>Sessions for {{ username }}</h2>
<table>
<tr>
    <th>unique_id</th>
    <th>connected</th>
    <th>disconnected</th>
    <th>vpn ip</th>
    <th>remote ip</th>
</tr>
{% for s in sessions %}
<tr>
    <td>{{ s.unique_id }}</td>
    <td>{{ s.connected_at }}</td>
    <td>{{ s.disconnected_at or '—' }}</td>
    <td>{{ s.assigned_ip }}</td>
    <td>{{ s.remote_ip }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
